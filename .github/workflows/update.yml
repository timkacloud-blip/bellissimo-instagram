name: update
on:
  schedule:
    # каждые 4 часа: сторис живут 24 часа, снимаем их несколько раз в день
    - cron: '23 */4 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: update
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install requests pillow
      - name: Collect
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          MAX_SEC: '7800'
        run: python3 collector/collect.py 2>&1 | tee data/collect_log.txt
      - name: Build
        run: python3 collector/build.py
      - name: Save data
        if: always()
        run: |
          git config user.name "ig-bot"
          git config user.email "ig-bot@users.noreply.github.com"
          git add data
          git commit -m "data $(date -u +%F_%H%M)" || echo "nothing to commit"
          git pull --rebase -X theirs || true
          git push
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - uses: actions/deploy-pages@v4
